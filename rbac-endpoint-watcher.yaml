# RBAC configuration for CloudStack Cloud Controller Manager endpoint watcher
# This enables automatic load balancer updates when endpoints change for services with externalTrafficPolicy: Local

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:cloud-controller-manager-endpoint-watcher
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:cloud-controller-manager-endpoint-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:cloud-controller-manager-endpoint-watcher
subjects:
- kind: ServiceAccount
  name: cloud-controller-manager
  namespace: kube-system
